# M20 REPORT SETTINGS
# Scope: this file supplies paths and display values for the manual report
# and the short-term Bash scripts built in the next course.
# Format: one KEY=VALUE setting per active line; comments begin with #.
# Do not change an active key name, add a duplicate key, or insert spaces
# around the equals sign. A path is relative to the working project root.
# Read docs/report_requirements.txt before changing these values.
#
# Project identity
PROJECT_NAME=M20 Readiness Reporting
# Data input: the singular spelling below came from an earlier draft.
DATA_FILE=data/system_status.dat
# Output location: the previous singular directory does not exist.
REPORT_DIR=report
# Older reports must remain available for review.
ARCHIVE_DIR=reports/old
# Allowed statuses are written without spaces, in the documented order.
ALLOWED_STATUSES=READY,MAINT,NOT READY
# The title appears at the top of reports created from this configuration.
REPORT_TITLE=M20 Status Report FINAL
#
# What each key controls
# PROJECT_NAME: the project named in the current approved plan.
# DATA_FILE: location of the pipe-delimited status records.
# REPORT_DIR: folder for the current manually reviewed report.
# ARCHIVE_DIR: folder for prior report copies.
# ALLOWED_STATUSES: comma-delimited list of three exact status strings.
# REPORT_TITLE: human-readable title; avoid unsupported FINAL claims.
#
# Validation notes
# A valid input row has four pipe-delimited values in the documented order.
# Do not count a row until its fields, status, and ISO date shape pass checks.
# Do not infer totals from the stale report included in the received package.
# The final baseline is 12 rows: 5 READY, 3 MAINTENANCE, 4 NOT_READY.
# Missing files or directories are errors; do not silently make up results.
#
# File handling notes
# Keep the incoming copy of this configuration unchanged.
# Verify every referenced relative path from ~/simple_editing/working.
# Create reports/archive in the working folder if it does not exist yet.
# Git will not record an empty reports/archive folder without a file in it.
# The Bash course can create that empty folder when running the pipeline.
# Avoid changing the meaning of a setting while only fixing its spelling.
#
# Review notes
# Check that every active key appears once and has one approved value.
# Review a focused diff against incoming/config/report_settings.conf.
# Record the checker and evidence under SEB-05 in the class Trello board.
#
# Operational examples for the six active settings
# Example 1: If DATA_FILE names a file that is absent, stop before counting.
# A matching filename elsewhere on the machine is not a safe substitute.
# Always resolve this path from the documented working project root.
#
# Example 2: REPORT_DIR is a directory; the name of the current report is
# specified in the report requirements. Do not confuse a directory value
# with a complete output filename. A one-letter difference can move output
# to an unexpected location without an obvious command error.
#
# Example 3: ARCHIVE_DIR is an output location for earlier report copies.
# Preserve prior evidence before replacing a current report. A historical
# report may have wrong counts and still explain why a repair was needed.
# An empty directory may exist on the VM but disappear in a Git checkout.
# Create it again when a later automation stage needs it.
#
# Example 4: ALLOWED_STATUSES contains literal strings, not descriptions.
# READY, MAINTENANCE, and NOT_READY are distinct values. A space, lowercase
# letter, or old abbreviation can cause a validation failure. Never infer
# a missing status from another system in the same unit.
#
# Example 5: REPORT_TITLE is for a person reading the output. A title
# containing FINAL does not provide an approval record. Confirm the report
# source, date, validation evidence, and checker before sharing it.
#
# Example 6: PROJECT_NAME is already correct in the received package.
# An editor who changes all six active settings has made one unnecessary
# change. Leave already-approved values alone and explain the diff.
#
# Troubleshooting notes for students
# A setting line beginning with # is a comment, not an active setting.
# Searching DATA_FILE finds a key, historical notes, and explanations.
# Verify the selected match is the active line without a leading #.
# A duplicated active key can leave readers uncertain which value applies.
# Check active keys separately from the comment lines before committing.
# A missing equals sign prevents a simple KEY=VALUE reader from finding
# the intended value. Do not insert spaces around = to align columns.
# The expected path check proves a target exists now; it does not prove
# that the target contains 12 valid records. Run the data checks separately.
# A correct status list in configuration does not repair a misspelled value
# inside the data file. Both locations must be checked.
# A correct report title does not make a stale manual report current.
# Check the report after validating and counting the source again.
